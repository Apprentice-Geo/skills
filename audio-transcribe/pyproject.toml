[project]
name = "audio-transcribe"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "audio-transcribe-contract==0.3.0",
    "faster-whisper==1.2.1",
    "ffmpeg-binaries-compat",
    "numpy",
    "OpenCC==1.4.1",
]

[project.optional-dependencies]
cpu = [
    "speechbrain",
    "torch",
    "torchaudio",
]
qwen3-asr = [
    "accelerate",
    "huggingface-hub",
    "librosa",
    "numba>=0.59.1",
    "qwen-asr",
    "soundfile",
    "speechbrain",
    "torch",
    "torchaudio",
    "transformers",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0,<9",
    "pytest-mock>=3.14,<4",
    "ruff>=0.15.22",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "tsinghua-pypi"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[tool.uv.index]]
name = "aliyun-pypi"
url = "https://mirrors.aliyun.com/pypi/simple"

[tool.uv]
index-strategy = "first-index"
conflicts = [[{ extra = "cpu" }, { extra = "qwen3-asr" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
audio-transcribe-contract = { path = "packages/audio-transcribe-contract" }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "qwen3-asr" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "qwen3-asr" },
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pyright]
include = [
    "benchmark",
    "scripts",
    "packages/audio-transcribe-contract/src",
    "tests/test_result_contract.py",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
