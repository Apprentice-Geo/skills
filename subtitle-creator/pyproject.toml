[project]
name = "subtitle-creator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "audio-transcribe-contract==0.1.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "ruff>=0.12.5",
]

[tool.uv.sources]
audio-transcribe-contract = { git = "https://github.com/Apprentice-Geo/skills.git", tag = "audio-transcribe-contract-v0.1.0", subdirectory = "audio-transcribe/packages/audio-transcribe-contract" }

[tool.pyright]
include = ["scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
