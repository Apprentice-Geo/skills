[project]
name = "subtitle-creator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "packaging>=24",
    "audio-transcribe-contract==0.4.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "ruff>=0.12.5",
]

[tool.uv.sources]
audio-transcribe-contract = { path = "../audio-transcribe/packages/audio-transcribe-contract", editable = true }

[tool.pyright]
include = ["scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
