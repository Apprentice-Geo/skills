[project]
name = "bili-audiosummary"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "audio-transcribe-contract==0.1.1",
    "yt-dlp==2026.3.17",
    "ffmpeg-binaries-compat",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0,<9",
    "pytest-mock>=3.14,<4",
    "pyyaml==6.0.3",
    "ruff>=0.15.22",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "tsinghua-pypi"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[tool.uv.index]]
name = "aliyun-pypi"
url = "https://mirrors.aliyun.com/pypi/simple"

[tool.uv]
index-strategy = "first-index"

[tool.uv.sources]
audio-transcribe-contract = { git = "https://github.com/Apprentice-Geo/skills.git", tag = "audio-transcribe-contract-v0.1.1", subdirectory = "audio-transcribe/packages/audio-transcribe-contract" }

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
]

[tool.pyright]
include = ["scripts"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
